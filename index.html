    <!-- Fuentes propias (public/fonts, @font-face en src/index.css): sin hoja
         externa que bloquee la pintura ni IPs de visitantes enviadas a terceros.
         Se pide ya la que usa la primera pantalla. La mono sólo aparece arriba
         en el selector de idioma, que en el móvil vive dentro del menú. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/host-grotesk-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fragment-mono-latin.woff2" crossorigin media="(min-width: 640px)" />
    <script>
      // Idioma recordado antes de que React monte (evita un parpadeo ES↔EN).
      (function () {
        try {
          var lang = localStorage.getItem('em-lang');
          if (lang) document.documentElement.lang = lang;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
