    <meta name="theme-color" content="#ffffff" />

    <!-- Fuentes propias (public/fonts, @font-face en src/index.css): sin hoja
         externa que bloquee la pintura ni IPs de visitantes enviadas a terceros.
         Se pide ya la que usa la primera pantalla. La mono sólo aparece arriba
         en el selector de idioma, que en el móvil vive dentro del menú. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/hanken-grotesk-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-latin.woff2" crossorigin media="(min-width: 640px)" />
    <script>
      // Idioma y tema recordados antes de que React monte: sin parpadeo ES↔EN
      // ni un destello claro antes del modo oscuro. Sin elección guardada, el
      // tema sigue al del sistema.
      (function () {
        var d = document.documentElement, lang, theme;
        try {
          lang = localStorage.getItem('em-lang');
          theme = localStorage.getItem('em-theme');
        } catch (_) {}
        if (lang) d.lang = lang;
        var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) d.classList.add('dark');
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute('content', dark ? '#0a0a0b' : '#ffffff');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
